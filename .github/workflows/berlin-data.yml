name: Berlin-Daten & Deploy

# Holt jeden Morgen die Berliner Nachtleben-Daten aus OpenStreetMap,
# bereinigt sie (scripts/build-berlin-data.ts), baut die Web-App und
# deployt sie auf Netlify.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  – Netlify Personal Access Token
#   NETLIFY_SITE_ID     – ID der Netlify-Site (Site configuration → Site ID)
# Ohne Secrets läuft alles bis auf das Deployment; die Daten liegen dann als
# Artefakt am Workflow-Lauf.

on:
  schedule:
    - cron: '23 3 * * *' # täglich 03:23 UTC (04:23/05:23 Berliner Zeit)
  workflow_dispatch:
  push:
    branches: [main, claude/quirky-clarke-3bbwcl]
    paths:
      - 'scripts/build-berlin-data.ts'
      - 'src/**'
      - 'App.tsx'
      - '.github/workflows/berlin-data.yml'

concurrency:
  group: berlin-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  data-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Berlin-Daten aus OpenStreetMap holen und bereinigen
        run: npm run data:berlin

      - uses: actions/upload-artifact@v4
        with:
          name: berlin-data
          path: public/data/berlin.json
          retention-days: 7

      # Der aktuelle Stand liegt zusätzlich auf dem Branch „berlin-data“
      # (ein einziger Commit, wird jedes Mal ersetzt) – so kann man ihn auch
      # ohne Netlify-Secrets abholen und deployen.
      - name: Daten auf Branch berlin-data ablegen
        run: |
          mkdir -p /tmp/berlin-data && cp public/data/berlin.json /tmp/berlin-data/
          cd /tmp/berlin-data
          git init -q -b berlin-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add berlin.json
          git commit -q -m "Berlin-Daten $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" berlin-data

      - name: Web-App bauen
        run: npx expo export --platform web

      - name: Auf Netlify deployen
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@27.14.2 deploy --prod --dir dist --site "$NETLIFY_SITE_ID" --message "Berlin-Daten $(date -u +%F)"
