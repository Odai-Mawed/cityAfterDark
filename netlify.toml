# Netlify: static web build of the Expo app
[build]
  # Berlin-Daten holen (darf scheitern – die App fällt dann auf Overpass zurück), dann bauen
  command = "(npm run data:berlin || echo 'Berlin-Daten nicht verfügbar') && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
